<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Football Imperialism</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap">
<style>
:root{
  color-scheme:dark;
  --night:#070B24; --deep:#0C1440; --panel:#111A4D; --panel-2:#18235E; --edge:#27347A;
  --ink:#EEF1FB; --muted:#9AA5CF; --silver:#C8CFE6; --cyan:#35D6FF; --gold:#F5C542; --red:#FF4B5C;
  --display:"Barlow Condensed","Arial Narrow",Impact,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(1200px 700px at 40% 45%,#15206A 0%,var(--deep) 45%,var(--night) 100%);color:var(--ink);font-family:var(--body);font-size:16px;overflow:hidden}
.app{height:100%;display:flex;flex-direction:column}
.stage{position:relative;overflow:hidden;flex:1;min-width:0;min-height:0;padding:0;display:flex;align-items:center;justify-content:center}
.bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px;padding:10px 16px 14px}
.bar .sep{width:1px;height:24px;background:var(--edge);margin:0 6px}
#map{width:100%;height:100%;display:block;cursor:grab;touch-action:none}
#map.dragging{cursor:grabbing}
.hex{stroke-width:1.5;stroke-linejoin:round;transition:filter .4s,opacity .4s}
.hex.dim{opacity:.35}
.logo{filter:drop-shadow(0 0 1.5px rgba(255,255,255,.85)) drop-shadow(0 2px 6px rgba(0,0,0,.55))}
.hex.flash{animation:flash .45s ease-in-out 4}
@keyframes flash{50%{filter:brightness(2.2)}}
.tag{font-family:var(--display);font-weight:800;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.side{background:linear-gradient(180deg,var(--panel),#0D1540);border-left:1px solid var(--edge);padding:24px 22px;display:flex;flex-direction:column;gap:18px;overflow:auto}
.brand{font-family:var(--display);font-weight:800;font-size:34px;line-height:.9;text-transform:uppercase;letter-spacing:.02em}
.brand span{color:var(--cyan);display:block}
.meta{display:flex;gap:18px;color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:.08em}
.meta b{display:block;font-family:var(--display);font-size:30px;color:var(--ink);letter-spacing:0;line-height:1}
.steps{display:flex;flex-direction:column;gap:10px}
button{font:inherit;color:var(--ink);background:var(--panel-2);border:1px solid var(--edge);border-radius:12px;padding:10px 14px;cursor:pointer;font-weight:600}
button:hover:not(:disabled){border-color:var(--silver)}
button:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
button:disabled{opacity:.35;cursor:not-allowed}
.big{display:inline-flex;align-items:center;gap:8px;font-family:var(--display);font-weight:700;font-size:17px;text-transform:uppercase;letter-spacing:.04em;padding:6px 14px 6px 8px;border-radius:999px}
.big i{font-style:normal;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--edge);font-size:13px}
.big.ready{background:var(--cyan);color:#061032;border-color:transparent;box-shadow:0 0 0 4px rgba(53,214,255,.18)}
.big.ready i{background:#061032;color:var(--cyan)}
.now{background:var(--panel-2);border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:12px;font-size:14px;color:var(--muted);min-height:74px}
.now b{color:var(--ink);font-size:16px;display:block}
.crest{width:50px;height:50px;flex:none}
.small{font-size:13px;padding:6px 11px;border-radius:999px}
.row{display:flex;flex-wrap:wrap;gap:8px}
h2{font-family:var(--display);font-weight:700;font-size:18px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:0}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;font-size:14px;color:var(--silver)}
.log b{color:var(--ink)}
.log .empty{color:var(--muted)}
.confirm{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--silver)}
.lang{position:relative}
.lang>button{display:inline-flex;align-items:center;gap:7px}
.flag{width:21px;height:14px;border-radius:2px;display:block;box-shadow:0 0 0 1px rgba(255,255,255,.25)}
.langmenu{position:absolute;bottom:calc(100% + 8px);right:0;background:var(--panel);border:1px solid var(--edge);border-radius:12px;padding:6px;display:grid;gap:2px;min-width:120px;box-shadow:0 12px 30px rgba(0,0,0,.45);z-index:5}
.langmenu button{display:flex;align-items:center;gap:9px;border:0;background:transparent;border-radius:8px;font-size:13px;padding:7px 10px;text-align:left}
.langmenu button:hover,.langmenu button.on{background:var(--panel-2)}
.danger{background:var(--red);border-color:transparent;color:#fff}
/* popups */
.overlay{position:fixed;inset:0;background:rgba(4,7,26,.78);backdrop-filter:blur(4px);display:grid;place-items:center;z-index:10;padding:24px}
.pop{background:linear-gradient(180deg,#16215F,#0D1545);border:1px solid var(--edge);border-radius:22px;padding:28px 34px;display:flex;flex-direction:column;align-items:center;gap:20px;max-width:100%;max-height:100%;box-shadow:0 30px 80px rgba(0,0,0,.5);animation:pop .35s cubic-bezier(.2,1.3,.4,1)}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.pop h3{font-family:var(--display);font-weight:800;font-size:28px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:0}
.wheelbox{position:relative;width:min(70vh,640px,80vw);aspect-ratio:1}
#wheel{width:100%;height:100%;display:block;cursor:pointer}
.pointer{position:absolute;top:-10px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:20px solid transparent;border-right:20px solid transparent;border-top:38px solid var(--gold);filter:drop-shadow(0 3px 4px rgba(0,0,0,.6))}
.winner{display:flex;flex-direction:column;align-items:center;gap:14px}
.winner .crest{width:min(34vh,300px);height:min(34vh,300px)}
.winner .name{font-family:var(--display);font-weight:800;font-size:clamp(40px,6vw,72px);text-transform:uppercase;line-height:1}
.primary{background:var(--cyan);color:#061032;border-color:transparent;font-family:var(--display);font-weight:800;font-size:24px;text-transform:uppercase;letter-spacing:.05em;padding:12px 28px}
.fixture{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:clamp(16px,4vw,60px)}
.fixture .side-t{display:flex;flex-direction:column;align-items:center;gap:12px;min-width:0}
.fixture .crest{width:min(28vh,240px);height:min(28vh,240px)}
.fixture .nm{font-family:var(--display);font-weight:800;font-size:clamp(26px,3.4vw,44px);text-transform:uppercase;text-align:center;line-height:1}
.fixture .role{font-size:13px;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);font-weight:700}
.fixture .dash{font-family:var(--display);font-weight:800;font-size:clamp(60px,9vw,120px);color:var(--silver);line-height:1}
.hint{color:var(--muted);font-size:14px;text-align:center}
@media (max-width:700px){.bar .sep{display:none}}
@media (prefers-reduced-motion:reduce){.pop{animation:none}.hex.flash{animation:none}}
</style>
</head>
<body>
<div class="app">
  <main class="stage"><svg id="map" role="img" aria-label="Hexagon map of Champions League teams"></svg></main>
  <nav class="bar">
    <button class="big" id="bWheel"><i>1</i><span data-t="wheel">Spin the wheel</span></button>
    <button class="big" id="bArrow"><i>2</i><span data-t="arrow">Spin the arrow</span></button>
    <span class="sep"></span>
    <button class="small" id="bCancel" data-t="cancel">Cancel turn</button>
    <button class="small" id="bUndo" data-t="undo">Undo</button>
    <button class="small" id="bShuffle" data-t="shuffle">Randomize</button>
    <button class="small" id="bNew" data-t="newGame">New game</button>
    <button class="small" id="bSound" aria-pressed="true"></button>
    <button class="small" id="bFull" aria-pressed="false"></button>
    <span class="lang" id="lang"></span>
    <span id="confirm"></span>
  </nav>
</div>
<div id="popup"></div>

<script>
/* 2026/27 Champions League league phase (UEFA list). Land colours are tones of each logo's main colour,
   tuned so every pair of teams is clearly different.  Put a logo at logos/<id>.png (or .svg) to replace the badge. */
/* ---------- languages (team names stay as they are) ---------- */
const FLAGS={
  tr:`<svg class="flag" viewBox="0 0 30 20"><rect width="30" height="20" fill="#E30A17"/><circle cx="11" cy="10" r="5" fill="#fff"/><circle cx="12.3" cy="10" r="4" fill="#E30A17"/><polygon points="16.40,7.70 16.96,9.23 18.59,9.29 17.30,10.29 17.75,11.86 16.40,10.95 15.05,11.86 15.50,10.29 14.21,9.29 15.84,9.23" fill="#fff"/></svg>`,
  de:`<svg class="flag" viewBox="0 0 30 20"><rect width="30" height="7" fill="#000"/><rect y="6.67" width="30" height="6.67" fill="#DD0000"/><rect y="13.33" width="30" height="6.67" fill="#FFCE00"/></svg>`,
  en:`<svg class="flag" viewBox="0 0 30 20"><rect width="30" height="20" fill="#fff"/><rect x="13" width="4" height="20" fill="#CE1124"/><rect y="8" width="30" height="4" fill="#CE1124"/></svg>`,
  fr:`<svg class="flag" viewBox="0 0 30 20"><rect width="10" height="20" fill="#0055A4"/><rect x="10" width="10" height="20" fill="#fff"/><rect x="20" width="10" height="20" fill="#EF4135"/></svg>`,
  it:`<svg class="flag" viewBox="0 0 30 20"><rect width="10" height="20" fill="#009246"/><rect x="10" width="10" height="20" fill="#fff"/><rect x="20" width="10" height="20" fill="#CE2B37"/></svg>`,
  es:`<svg class="flag" viewBox="0 0 30 20"><rect width="30" height="20" fill="#AA151B"/><rect y="5" width="30" height="10" fill="#F1BF00"/></svg>`
};
const LANGS=[["tr","TUR"],["de","GER"],["en","ENG"],["fr","FRA"],["it","ITA"],["es","ESP"]];
const STR={
  en:{shuffle:"Randomize",fsOn:"Full screen",fsOff:"Exit full screen",soundOn:"Sound on",soundOff:"Sound off",title:"Football Imperialism",wheel:"Spin the wheel",arrow:"Spin the arrow",cancel:"Cancel turn",undo:"Undo",newGame:"New game",confirmQ:"Reshuffle and clear all results?",confirmYes:"Start new game",confirmNo:"Keep playing",whoAttacks:"Who attacks?",spin:"Spin",close:"Close",attackerIs:"The attacker is",goMap:"Go to the map",defends:"Defends",attacks:"Attacks",hint:"Play it in FC27, then pick the winner. The winner takes all of the loser's land.",won:"{t} won",champion:"Champion of Europe",holds:"Holds all 36 blocks after {n} matches.",wheelAria:"Wheel of teams that still hold land",mapAria:"Hexagon map of Champions League teams",language:"Language"},
  tr:{shuffle:"Karıştır",fsOn:"Tam ekran",fsOff:"Tam ekrandan çık",soundOn:"Ses açık",soundOff:"Ses kapalı",title:"Futbol Emperyalizmi",wheel:"Çarkı çevir",arrow:"Oku çevir",cancel:"Turu iptal et",undo:"Geri al",newGame:"Yeni oyun",confirmQ:"Takımlar karıştırılsın ve tüm sonuçlar silinsin mi?",confirmYes:"Yeni oyuna başla",confirmNo:"Oynamaya devam et",whoAttacks:"Kim saldırıyor?",spin:"Çevir",close:"Kapat",attackerIs:"Saldıran takım",goMap:"Haritaya git",defends:"Savunuyor",attacks:"Saldırıyor",hint:"Maçı FC27'de oyna, sonra kazananı seç. Kazanan, kaybedenin tüm topraklarını alır.",won:"{t} kazandı",champion:"Avrupa Şampiyonu",holds:"{n} maçın sonunda 36 bölgenin hepsine sahip.",wheelAria:"Toprağı olan takımların çarkı",mapAria:"Şampiyonlar Ligi takımlarının altıgen haritası",language:"Dil"},
  de:{shuffle:"Neu mischen",fsOn:"Vollbild",fsOff:"Vollbild beenden",soundOn:"Ton an",soundOff:"Ton aus",title:"Fußball-Imperialismus",wheel:"Rad drehen",arrow:"Pfeil drehen",cancel:"Zug abbrechen",undo:"Rückgängig",newGame:"Neues Spiel",confirmQ:"Neu mischen und alle Ergebnisse löschen?",confirmYes:"Neues Spiel starten",confirmNo:"Weiterspielen",whoAttacks:"Wer greift an?",spin:"Drehen",close:"Schließen",attackerIs:"Der Angreifer ist",goMap:"Zur Karte",defends:"Verteidigt",attacks:"Greift an",hint:"Spiel es in FC27 und wähle dann den Sieger. Der Sieger übernimmt das gesamte Gebiet des Verlierers.",won:"{t} gewinnt",champion:"Europas Champion",holds:"Besitzt nach {n} Spielen alle 36 Felder.",wheelAria:"Rad der Teams, die noch Gebiet haben",mapAria:"Sechseckkarte der Champions-League-Teams",language:"Sprache"},
  fr:{shuffle:"Mélanger",fsOn:"Plein écran",fsOff:"Quitter le plein écran",soundOn:"Son activé",soundOff:"Son coupé",title:"Impérialisme du football",wheel:"Tourner la roue",arrow:"Tourner la flèche",cancel:"Annuler le tour",undo:"Revenir",newGame:"Nouvelle partie",confirmQ:"Mélanger et effacer tous les résultats ?",confirmYes:"Lancer une nouvelle partie",confirmNo:"Continuer",whoAttacks:"Qui attaque ?",spin:"Tourner",close:"Fermer",attackerIs:"L'attaquant est",goMap:"Aller à la carte",defends:"Défend",attacks:"Attaque",hint:"Jouez-le sur FC27, puis choisissez le vainqueur. Le vainqueur prend tout le territoire du perdant.",won:"{t} gagne",champion:"Champion d'Europe",holds:"Possède les 36 cases après {n} matchs.",wheelAria:"Roue des équipes qui ont encore un territoire",mapAria:"Carte hexagonale des équipes de Ligue des champions",language:"Langue"},
  it:{shuffle:"Mescola",fsOn:"Schermo intero",fsOff:"Esci da schermo intero",soundOn:"Audio attivo",soundOff:"Audio disattivato",title:"Imperialismo calcistico",wheel:"Gira la ruota",arrow:"Gira la freccia",cancel:"Annulla turno",undo:"Indietro",newGame:"Nuova partita",confirmQ:"Rimescolare e cancellare tutti i risultati?",confirmYes:"Inizia nuova partita",confirmNo:"Continua a giocare",whoAttacks:"Chi attacca?",spin:"Gira",close:"Chiudi",attackerIs:"L'attaccante è",goMap:"Vai alla mappa",defends:"Difende",attacks:"Attacca",hint:"Giocala su FC27, poi scegli il vincitore. Il vincitore prende tutto il territorio dello sconfitto.",won:"Vince {t}",champion:"Campione d'Europa",holds:"Possiede tutte le 36 caselle dopo {n} partite.",wheelAria:"Ruota delle squadre che hanno ancora territorio",mapAria:"Mappa esagonale delle squadre di Champions League",language:"Lingua"},
  es:{shuffle:"Mezclar",fsOn:"Pantalla completa",fsOff:"Salir de pantalla completa",soundOn:"Sonido activado",soundOff:"Sonido desactivado",title:"Imperialismo futbolístico",wheel:"Girar la ruleta",arrow:"Girar la flecha",cancel:"Cancelar turno",undo:"Deshacer",newGame:"Nueva partida",confirmQ:"¿Mezclar y borrar todos los resultados?",confirmYes:"Empezar nueva partida",confirmNo:"Seguir jugando",whoAttacks:"¿Quién ataca?",spin:"Girar",close:"Cerrar",attackerIs:"El atacante es",goMap:"Ir al mapa",defends:"Defiende",attacks:"Ataca",hint:"Juega el partido en FC27 y elige al ganador. El ganador se queda con todo el territorio del perdedor.",won:"Gana {t}",champion:"Campeón de Europa",holds:"Tiene las 36 casillas tras {n} partidos.",wheelAria:"Ruleta de los equipos que aún tienen territorio",mapAria:"Mapa hexagonal de los equipos de la Champions League",language:"Idioma"}
};
const LKEY="football-imperialism-lang";
let lang="en"; try{const v=localStorage.getItem(LKEY); if(STR[v]) lang=v;}catch(e){}
let langOpen=false;
const L=k=>STR[lang][k]??STR.en[k];
function applyLang(){
  document.documentElement.lang=lang; document.title=L("title");
  document.getElementById("map").setAttribute("aria-label",L("mapAria"));
  document.querySelectorAll("[data-t]").forEach(e=>e.textContent=L(e.dataset.t));
  if(typeof renderSound==="function") renderSound();
  if(typeof renderFull==="function") renderFull();
  const code=LANGS.find(l=>l[0]===lang)[1];
  const box=document.getElementById("lang");
  box.innerHTML=`<button class="small" id="langBtn" aria-haspopup="true" aria-expanded="${langOpen}" aria-label="${L("language")}">${FLAGS[lang]}${code}</button>`+
    (langOpen?`<div class="langmenu" role="menu">${LANGS.map(([k,c])=>`<button role="menuitem" class="${k===lang?"on":""}" data-lang="${k}">${FLAGS[k]}${c}</button>`).join("")}</div>`:"");
  document.getElementById("langBtn").onclick=e=>{e.stopPropagation();langOpen=!langOpen;applyLang()};
  box.querySelectorAll("[data-lang]").forEach(b=>b.onclick=e=>{e.stopPropagation();lang=b.dataset.lang;langOpen=false;try{localStorage.setItem(LKEY,lang)}catch(_){}applyLang();renderSide()});
}
document.addEventListener("click",()=>{if(langOpen){langOpen=false;applyLang()}});

const TEAMS = [
  ["aek","AEK Athens","AEK","#D6BE3E","#141414"],
  ["arsenal","Arsenal","ARS","#FA2300","#FFFFFF"],
  ["aston-villa","Aston Villa","AVL","#974881","#95BFE5"],
  ["atletico","Atlético de Madrid","ATM","#AD4F43","#272E61"],
  ["barcelona","Barcelona","BAR","#970058","#004D98"],
  ["bayern","Bayern München","FCB","#EE336F","#FFFFFF"],
  ["bodo-glimt","Bodø/Glimt","BOD","#F9F847","#141414"],
  ["dortmund","Borussia Dortmund","BVB","#FFD321","#141414"],
  ["club-brugge","Club Brugge","CLB","#518CF8","#141414"],
  ["como","Como","COM","#2E2C85","#FFFFFF"],
  ["fenerbahce","Fenerbahçe","FB","#16236A","#FFE000"],
  ["feyenoord","Feyenoord","FEY","#FF7E16","#FFFFFF"],
  ["galatasaray","Galatasaray","GS","#D42500","#F4B223"],
  ["inter","Inter","INT","#055A8C","#141414"],
  ["lask","LASK","LASK","#1C1C1C","#FFFFFF"],
  ["leipzig","RB Leipzig","RBL","#FF99BF","#FFFFFF"],
  ["lens","Lens","RCL","#FFF0A3","#E30613"],
  ["lille","Lille","LOSC","#CB1551","#1B2A55"],
  ["liverpool","Liverpool","LIV","#FFFFFF","#C8102E"],
  ["man-city","Manchester City","MCI","#86BBDA","#FFFFFF"],
  ["man-united","Manchester United","MUN","#A80520","#FBE122"],
  ["napoli","Napoli","NAP","#15A9D2","#FFFFFF"],
  ["psg","Paris Saint-Germain","PSG","#083153","#DA291C"],
  ["porto","Porto","FCP","#4E6BC5","#FFFFFF"],
  ["psv","PSV","PSV","#D89B91","#FFFFFF"],
  ["betis","Real Betis","BET","#4ABA61","#FFFFFF"],
  ["real-madrid","Real Madrid","RMA","#C7C7C7","#FEBE10"],
  ["roma","Roma","ROM","#6E1600","#F0BC42"],
  ["sabah","Sabah","SAB","#D04CA1","#141414"],
  ["shakhtar","Shakhtar Donetsk","SHA","#CF7717","#141414"],
  ["slavia","Slavia Praha","SLA","#FDD9D9","#E30613"],
  ["slovan","Slovan Bratislava","SLO","#BFE6FA","#FFFFFF"],
  ["sporting","Sporting CP","SCP","#00503B","#008057"],
  ["stuttgart","Stuttgart","VFB","#D7615F","#FFFFFF"],
  ["viking","Viking","VIK","#743444","#E4C06A"],
  ["villarreal","Villarreal","VIL","#E8D094","#005187"]
].map(([id,name,short,c1,c2])=>({id,name,short,c1,c2,logo:null}));
const T = Object.fromEntries(TEAMS.map(t=>[t.id,t]));

const COLS=9, ROWS=4, R=100, W=Math.sqrt(3)*R, PAD=40;
const HEX=[];
for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++) HEX.push({x:PAD+W/2+c*W+(r%2)*W/2, y:PAD+R+r*1.5*R});
HEX.forEach((h,i)=>h.nb=HEX.map((o,j)=>j).filter(j=>j!==i&&Math.hypot(HEX[j].x-h.x,HEX[j].y-h.y)<W*1.05));
const MAPW=PAD*2+W*(COLS+.5), MAPH=PAD*2+R*(2+1.5*(ROWS-1));
const FULL=[0,0,MAPW,MAPH];
const SPIN_MS=4000;
const reduced=matchMedia("(prefers-reduced-motion: reduce)").matches;

function lum(hex){const n=parseInt(hex.slice(1),16);const c=[n>>16,(n>>8)&255,n&255].map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});return .2126*c[0]+.7152*c[1]+.0722*c[2]}
const textOn=h=>lum(h)>.45?"#0B1030":"#FFFFFF";
const shade=(hex,f)=>{const n=parseInt(hex.slice(1),16);const ch=[n>>16,(n>>8)&255,n&255].map(v=>Math.round(f<0?v*(1+f):v+(255-v)*f));return "#"+ch.map(v=>v.toString(16).padStart(2,"0")).join("")};
const ease=t=>1-Math.pow(1-t,3); // fast start, slow finish
const tn=t=>`<span lang="en">${esc(t.name)}</span>`; // team names keep their own spelling in every language
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------- state ---------- */
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function fresh(){return {seed:(Math.random()*2**31)|0,owner:shuffle(TEAMS.map(t=>t.id)),phase:"wheel",att:null,def:null,defHex:null,angle:0,log:[]}}
const KEY="football-imperialism-ucl-v1";
let S; try{S=JSON.parse(localStorage.getItem(KEY)||"null")}catch(e){}
if(!S||!Array.isArray(S.owner)||S.owner.length!==HEX.length||!S.owner.every(o=>T[o])) S=fresh();
if(S.seed==null) S.seed=(Math.random()*2**31)|0;
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
let busy=false, confirmNew=false, arrowRot=S.angle||0, view=FULL.slice();

const alive=()=>TEAMS.filter(t=>S.owner.includes(t.id));
const hexesOf=id=>S.owner.map((o,i)=>o===id?i:-1).filter(i=>i>=0);
/* one logo per team: odd land count -> the middle block, even -> the edge between the two middle blocks.
   Logos grow with the land, then shrink where needed so two logos never overlap. */
const BASE_LOGO=R*1.02;
/* one logo per team, at the roomiest point of its whole land (the centre of the biggest circle that fits inside it,

  await new Promise(r=>setTimeout(r,700));
  S.att=t.id;S.def=null;S.defHex=null;S.angle=0;arrowRot=0;S.phase="arrow";save();busy=false;
  pop.innerHTML=`<div class="overlay"><div class="pop"><h3>${L("attackerIs")}</h3>
    <div class="winner">${crestSVG(t)}<div class="name">${tn(t)}</div></div>
    <button class="primary" id="pGo">${L("goMap")}</button></div></div>`;
  document.getElementById("pGo").onclick=async()=>{closePop();renderAll();busy=true;renderSide();await zoomTo(focusBox(S.att));busy=false;renderSide()};
  renderSide();
}

/* ---------- arrow ---------- */
async function spinArrow(){
  if(busy||S.phase!=="arrow") return; commitLive(); busy=true; renderSide();
  const start=arrowRot%360, final=Math.random()*360;
  const end=start+360*(5+Math.floor(Math.random()*3))+((final-start)%360+360)%360;
  const click=spinTicker();
  // spin a copy of the pointer on its own GPU layer above the map, so the map is not redrawn every frame
  const a=logoSpot(S.att), sc=(logoLayout()[S.att]?.s||BASE_LOGO)/BASE_LOGO, m=svg.getScreenCTM(), Lr=R*1.8, px=2*Lr*sc*m.a;
  const ov=document.createElement("div");
  ov.style.cssText=`position:fixed;left:${m.a*a.x+m.e-px/2}px;top:${m.d*a.y+m.f-px/2}px;width:${px}px;height:${px}px;pointer-events:none;will-change:transform;z-index:5`;
  ov.innerHTML=`<svg viewBox="${-Lr} ${-Lr} ${2*Lr} ${2*Lr}" width="100%" height="100%" style="display:block;overflow:visible">${needle.innerHTML}</svg>`;
  document.body.appendChild(ov); needle.setAttribute("visibility","hidden");
  await animate(SPIN_MS,t=>{arrowRot=start+(end-start)*ease(t);ov.style.transform=`rotate(${arrowRot}deg)`;click(t)});
  arrowRot=final; needle.setAttribute("transform",`rotate(${arrowRot})`); needle.removeAttribute("visibility"); ov.remove();
  S.angle=Math.round(final);S.defHex=defenderFor(S.att,final);S.def=S.owner[S.defHex];S.phase="match";save();
  busy=false; renderAll();
  await new Promise(r=>setTimeout(r,reduced?100:700)); // a beat to see where the arrow landed
  openMatch();
}

/* ---------- match ---------- */
function openMatch(){
  if(busy||S.phase!=="match") return;
  const a=T[S.att],d=T[S.def];
  pop.innerHTML=`<div class="overlay"><div class="pop">
    <div class="fixture">
      <div class="side-t">${crestSVG(d)}<div class="nm">${tn(d)}</div><div class="role">${L("defends")}</div></div>
      <div class="dash">-</div>
      <div class="side-t">${crestSVG(a)}<div class="nm">${tn(a)}</div><div class="role">${L("attacks")}</div></div>
    </div>
    <div class="hint">${L("hint")}</div>
    <div class="row"><button class="primary" id="wD">${L("won").replace("{t}",tn(d))}</button><button class="primary" id="wA">${L("won").replace("{t}",tn(a))}</button></div>
    <button id="pCancel">${L("cancel")}</button></div></div>`;
  document.getElementById("wD").onclick=()=>result(d.id);
  document.getElementById("wA").onclick=()=>result(a.id);
  document.getElementById("pCancel").onclick=()=>{closePop();cancelTurn()};
}
async function result(win){
  closePop(); busy=true; renderSide();
  const lose=win===S.att?S.def:S.att, lost=hexesOf(lose);
  lost.forEach(i=>svg.querySelector(`[data-hex="${i}"]`).classList.add("flash"));
  await new Promise(r=>setTimeout(r,reduced?100:1800));
  const prev=S.owner.slice();
  S.owner=S.owner.map(o=>o===lose?win:o);
  S.log.push({att:S.att,def:S.def,win,lose,taken:lost.length,prev});
  S.att=S.def=S.defHex=null;S.phase=alive().length<=1?"over":"wheel";save();
  renderAll(); await new Promise(r=>setTimeout(r,reduced?100:1000)); // hold on the new border for a second
  await zoomTo(FULL); busy=false; renderAll();
  if(S.phase==="over"){const c=alive()[0];pop.innerHTML=`<div class="overlay"><div class="pop"><h3>${L("champion")}</h3><div class="winner">${crestSVG(c)}<div class="name">${tn(c)}</div></div><div class="hint">${L("holds").replace("{n}",S.log.length)}</div><button class="primary" id="pOk">${L("close")}</button></div></div>`;document.getElementById("pOk").onclick=closePop}
}

/* ---------- side panel ---------- */
function renderSide(){
  const ph=S.phase;
  const set=(id,ready)=>{const b=document.getElementById(id);b.disabled=busy||!ready;b.classList.toggle("ready",!busy&&ready)};
  set("bWheel",ph==="wheel");set("bArrow",ph==="arrow");
  document.getElementById("bCancel").disabled=busy||!(ph==="arrow"||ph==="match");
  document.getElementById("bUndo").disabled=busy||!S.log.length;
  document.getElementById("bNew").disabled=busy;
  document.getElementById("bShuffle").disabled=busy||S.log.length>0||ph!=="wheel"; // only before the first land is taken
  const cf=document.getElementById("confirm");
  if(confirmNew){
    cf.innerHTML=`<span class="confirm">${L("confirmQ")} <button class="small danger" id="cYes">${L("confirmYes")}</button><button class="small" id="cNo">${L("confirmNo")}</button></span>`;
    document.getElementById("cYes").onclick=()=>{confirmNew=false;S=fresh();save();view=FULL.slice();renderAll()};
    document.getElementById("cNo").onclick=()=>{confirmNew=false;renderSide()};
  } else cf.innerHTML="";
}
function renderAll(){renderMap();renderSide()}
document.getElementById("bWheel").onclick=openWheel;
document.getElementById("bArrow").onclick=spinArrow;
async function cancelTurn(){S.att=S.def=S.defHex=null;S.phase="wheel";save();renderAll();busy=true;await zoomTo(FULL);busy=false;renderSide()}
document.getElementById("bCancel").onclick=cancelTurn;
document.getElementById("bUndo").onclick=async()=>{const e=S.log.pop();if(!e)return;S.owner=e.prev;S.att=S.def=S.defHex=null;S.phase="wheel";save();renderAll();busy=true;await zoomTo(FULL);busy=false;renderSide()};
document.getElementById("bShuffle").onclick=()=>{if(S.log.length||S.phase!=="wheel"||busy)return;confirmNew=false;S=fresh();save();view=FULL.slice();renderAll()};
document.getElementById("bNew").onclick=()=>{confirmNew=true;renderSide()};

if(S.att&&(S.phase==="arrow"||S.phase==="match")) view=focusBox(S.att);
/* ---------- sound (made in the browser, no audio files) ---------- */
const SKEY="football-imperialism-sound";
let soundOn=true; try{soundOn=localStorage.getItem(SKEY)!=="off"}catch(e){}
let actx=null;
function audio(){ if(!soundOn) return null; try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==="suspended") actx.resume(); }catch(e){ return null } return actx }
let lastTick=0;
function tick(pitch=.7){ // soft wooden click, like a peg hitting the pointer
  const a=audio(); if(!a) return; const now=a.currentTime;
  if(now-lastTick<.05) return; lastTick=now; // never faster than 20 clicks a second, so a fast spin doesn't turn into a buzz
  const o=a.createOscillator(), g=a.createGain(), f=a.createBiquadFilter();
  o.type="triangle"; o.frequency.setValueAtTime(1400*pitch,now); o.frequency.exponentialRampToValueAtTime(420*pitch,now+.04);
  f.type="highpass"; f.frequency.value=300;
  g.gain.setValueAtTime(.0001,now); g.gain.exponentialRampToValueAtTime(.12,now+.003); g.gain.exponentialRampToValueAtTime(.0001,now+.06);
  o.connect(f).connect(g).connect(a.destination); o.start(now); o.stop(now+.07);
}
function spinTicker(){ // clicks spaced by spin speed: quick at the start, further apart as it slows
  let next=0;
  return t=>{ const now=performance.now(), speed=Math.pow(1-t,2); // ease-out cubic: speed falls with (1-t)^2
    if(now<next) return; const gap=50/Math.max(speed,1e-6); if(gap>1300) return;
    tick(.7); next=now+gap; };
}
function fanfare(){ // bright rising chord for the reveal
  const a=audio(); if(!a) return; const now=a.currentTime;
  [523.25,659.25,783.99,1046.5].forEach((fr,i)=>{
    const o=a.createOscillator(), g=a.createGain(); o.type="sawtooth"; o.frequency.value=fr;
    const lp=a.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=2600;
    const t0=now+i*.09; g.gain.setValueAtTime(.0001,t0); g.gain.exponentialRampToValueAtTime(.12,t0+.02); g.gain.exponentialRampToValueAtTime(.0001,t0+.9);
    o.connect(lp).connect(g).connect(a.destination); o.start(t0); o.stop(t0+1);
  });
}
function renderSound(){const b=document.getElementById("bSound");b.textContent=(soundOn?"🔊 ":"🔇 ")+L(soundOn?"soundOn":"soundOff");b.setAttribute("aria-pressed",soundOn)}
const fsEl=()=>document.fullscreenElement||document.webkitFullscreenElement;
function renderFull(){const b=document.getElementById("bFull");const on=!!fsEl();b.textContent=(on?"🗗 ":"⛶ ")+L(on?"fsOff":"fsOn");b.setAttribute("aria-pressed",on)}
{const b=document.getElementById("bFull"),de=document.documentElement;
 if(!(de.requestFullscreen||de.webkitRequestFullscreen)) b.hidden=true; // e.g. iPhone Safari has no page full screen
 b.onclick=()=>{ if(fsEl()) (document.exitFullscreen||document.webkitExitFullscreen).call(document);
   else (de.requestFullscreen||de.webkitRequestFullscreen).call(de) };
 document.addEventListener("fullscreenchange",renderFull); document.addEventListener("webkitfullscreenchange",renderFull); renderFull();}
document.getElementById("bSound").onclick=()=>{soundOn=!soundOn;try{localStorage.setItem(SKEY,soundOn?"on":"off")}catch(e){}renderSound();if(soundOn)tick()};
applyLang(); renderAll(); loadLogos();
if(S.phase==="match") openMatch(); // reopen an unfinished match after a reload
document.fonts&&document.fonts.ready.then(renderAll);
</script>
