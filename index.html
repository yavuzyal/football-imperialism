<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Football Imperialism</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap">
<style>
:root{
  color-scheme:dark;
  --night:#070B24; --deep:#0C1440; --panel:#111A4D; --panel-2:#18235E; --edge:#27347A;
  --ink:#EEF1FB; --muted:#9AA5CF; --silver:#C8CFE6; --cyan:#35D6FF; --gold:#F5C542; --red:#FF4B5C;
  --display:"Barlow Condensed","Arial Narrow",Impact,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(1200px 700px at 40% 45%,#15206A 0%,var(--deep) 45%,var(--night) 100%);color:var(--ink);font-family:var(--body);font-size:16px;overflow:hidden}
.app{height:100%;display:flex;flex-direction:column}
.stage{position:relative;overflow:hidden;flex:1;min-width:0;min-height:0;padding:0;display:flex;align-items:center;justify-content:center}
.bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px;padding:10px 16px 14px}
.bar .sep{width:1px;height:24px;background:var(--edge);margin:0 6px}
#map{width:100%;height:100%;display:block;cursor:grab;touch-action:none}
#map.dragging{cursor:grabbing}
.hex{stroke-width:1.5;stroke-linejoin:round;transition:filter .4s,opacity .4s}
.hex.dim{opacity:.35}
.logo{filter:drop-shadow(0 0 1.5px rgba(255,255,255,.85)) drop-shadow(0 2px 6px rgba(0,0,0,.55))}
.hex.flash{animation:flash .45s ease-in-out 4}
@keyframes flash{50%{filter:brightness(2.2)}}
.tag{font-family:var(--display);font-weight:800;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.side{background:linear-gradient(180deg,var(--panel),#0D1540);border-left:1px solid var(--edge);padding:24px 22px;display:flex;flex-direction:column;gap:18px;overflow:auto}
.brand{font-family:var(--display);font-weight:800;font-size:34px;line-height:.9;text-transform:uppercase;letter-spacing:.02em}
.brand span{color:var(--cyan);display:block}
.meta{display:flex;gap:18px;color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:.08em}
.meta b{display:block;font-family:var(--display);font-size:30px;color:var(--ink);letter-spacing:0;line-height:1}
.steps{display:flex;flex-direction:column;gap:10px}
button{font:inherit;color:var(--ink);background:var(--panel-2);border:1px solid var(--edge);border-radius:12px;padding:10px 14px;cursor:pointer;font-weight:600}
button:hover:not(:disabled){border-color:var(--silver)}
button:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
button:disabled{opacity:.35;cursor:not-allowed}
.big{display:inline-flex;align-items:center;gap:8px;font-family:var(--display);font-weight:700;font-size:17px;text-transform:uppercase;letter-spacing:.04em;padding:6px 14px 6px 8px;border-radius:999px}
.big i{font-style:normal;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--edge);font-size:13px}
.big.ready{background:var(--cyan);color:#061032;border-color:transparent;box-shadow:0 0 0 4px rgba(53,214,255,.18)}
.big.ready i{background:#061032;color:var(--cyan)}
.now{background:var(--panel-2);border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:12px;font-size:14px;color:var(--muted);min-height:74px}
.now b{color:var(--ink);font-size:16px;display:block}
.crest{width:50px;height:50px;flex:none}
.small{font-size:13px;padding:6px 11px;border-radius:999px}
.row{display:flex;flex-wrap:wrap;gap:8px}
h2{font-family:var(--display);font-weight:700;font-size:18px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:0}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;font-size:14px;color:var(--silver)}
.log b{color:var(--ink)}
.log .empty{color:var(--muted)}
.confirm{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--silver)}
.lang{position:relative}
.lang>button{display:inline-flex;align-items:center;gap:7px}
.flag{width:21px;height:14px;border-radius:2px;display:block;box-shadow:0 0 0 1px rgba(255,255,255,.25)}
.langmenu{position:absolute;bottom:calc(100% + 8px);right:0;background:var(--panel);border:1px solid var(--edge);border-radius:12px;padding:6px;display:grid;gap:2px;min-width:120px;box-shadow:0 12px 30px rgba(0,0,0,.45);z-index:5}
.langmenu button{display:flex;align-items:center;gap:9px;border:0;background:transparent;border-radius:8px;font-size:13px;padding:7px 10px;text-align:left}
.langmenu button:hover,.langmenu button.on{background:var(--panel-2)}
.danger{background:var(--red);border-color:transparent;color:#fff}
/* main menu */
.menu{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;padding:24px;
  background:radial-gradient(900px 560px at 50% 42%,rgba(21,32,106,.82) 0%,rgba(7,11,36,.94) 70%);backdrop-filter:blur(6px)}
.menu[hidden]{display:none}
.menu .title{font-family:var(--display);font-weight:800;font-size:clamp(46px,8vw,104px);line-height:.88;text-transform:uppercase;text-align:center;letter-spacing:.02em;margin:0}
.menu .title span{display:block;color:var(--cyan)}
.menu h2{font-size:16px}
.leagues{display:grid;grid-template-columns:repeat(2,440px);gap:16px}
@media (max-width:940px){.leagues{grid-template-columns:minmax(0,440px)}}
.league{display:flex;align-items:center;gap:16px;width:100%;min-height:92px;padding:16px 26px 16px 18px;border-radius:18px;background:linear-gradient(180deg,#1B2A78,#111A4D);text-align:left}
.league:hover{box-shadow:0 0 0 4px rgba(53,214,255,.2)}
.league img{width:58px;height:58px;flex:none;filter:drop-shadow(0 2px 4px rgba(0,0,0,.4))}
.league b{display:block;font-family:var(--display);font-weight:800;font-size:26px;white-space:nowrap;text-transform:uppercase;letter-spacing:.03em;line-height:1}
.league small{color:var(--muted);font-size:14px;font-weight:600}
/* popups */
.overlay{position:fixed;inset:0;background:rgba(4,7,26,.78);backdrop-filter:blur(4px);display:grid;place-items:center;z-index:10;padding:24px}
.pop{background:linear-gradient(180deg,#16215F,#0D1545);border:1px solid var(--edge);border-radius:22px;padding:28px 34px;display:flex;flex-direction:column;align-items:center;gap:20px;max-width:100%;max-height:100%;box-shadow:0 30px 80px rgba(0,0,0,.5);animation:pop .35s cubic-bezier(.2,1.3,.4,1)}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.pop h3{font-family:var(--display);font-weight:800;font-size:28px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:0}
.wheelbox{position:relative;width:min(70vh,640px,80vw);aspect-ratio:1}
#wheel{width:100%;height:100%;display:block;cursor:pointer}
.pointer{position:absolute;top:-10px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:20px solid transparent;border-right:20px solid transparent;border-top:38px solid var(--gold);filter:drop-shadow(0 3px 4px rgba(0,0,0,.6))}
.winner{display:flex;flex-direction:column;align-items:center;gap:14px}
.winner .crest{width:min(34vh,300px);height:min(34vh,300px)}
.winner .name{font-family:var(--display);font-weight:800;font-size:clamp(40px,6vw,72px);text-transform:uppercase;line-height:1}
.primary{background:var(--cyan);color:#061032;border-color:transparent;font-family:var(--display);font-weight:800;font-size:24px;text-transform:uppercase;letter-spacing:.05em;padding:12px 28px}
.fixture{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:clamp(16px,4vw,60px)}
.fixture .side-t{display:flex;flex-direction:column;align-items:center;gap:12px;min-width:0}
.fixture .crest{width:min(28vh,240px);height:min(28vh,240px)}
.fixture .nm{font-family:var(--display);font-weight:800;font-size:clamp(26px,3.4vw,44px);text-transform:uppercase;text-align:center;line-height:1}
.fixture .role{font-size:13px;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);font-weight:700}
.fixture .dash{font-family:var(--display);font-weight:800;font-size:clamp(60px,9vw,120px);color:var(--silver);line-height:1}
.hint{color:var(--muted);font-size:14px;text-align:center}
.fixture .ovr{font-family:var(--display);font-weight:800;font-size:18px;color:var(--gold);letter-spacing:.06em}
.fixture .score{font-family:var(--display);font-weight:800;font-size:clamp(60px,9vw,120px);color:var(--ink);line-height:1;white-space:nowrap}
[hidden]{display:none!important}
.clock{font-family:var(--display);font-weight:800;font-size:20px;color:var(--cyan);letter-spacing:.08em;min-height:24px}
.events{display:grid;grid-template-columns:1fr 1fr;gap:4px 40px;width:min(720px,80vw);max-height:22vh;overflow:auto;font-size:15px}
.events .ev{color:var(--ink)} .events .evL{text-align:right} .events b{color:var(--gold);font-weight:800}
.pens{font-size:15px;color:var(--muted);text-align:center;min-height:20px;display:flex;flex-direction:column;gap:4px}
.pens .pl .dots{font-style:normal;letter-spacing:.15em;font-size:18px}.pens .dots .ok{color:#2ECC71}.pens .dots .miss{color:#FF4B5C}
.squad{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px;width:min(1080px,88vw);max-height:48vh;overflow:auto;padding:2px}
.squad button{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:10px;text-align:left;padding:8px 10px}
.squad .o{font-family:var(--display);font-weight:800;font-size:22px;color:var(--gold);text-align:center}
.squad .n{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.squad .ps{font-size:12px;color:var(--muted);font-weight:700}
.squad .new{color:var(--cyan)}
.pop.wide{width:min(1500px,96vw)}
.steal{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:22px;width:100%}
.xiHead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-family:var(--display);font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:8px}
.xiHead b{color:var(--gold);font-size:20px}.xiHead em{color:var(--cyan);font-style:normal}
.pitch{display:flex;flex-direction:column;justify-content:space-around;gap:10px;min-height:52vh;padding:14px;border-radius:14px;background:linear-gradient(180deg,rgba(40,140,80,.28),rgba(20,90,50,.28));border:1px solid rgba(255,255,255,.12)}
.prow{display:flex;justify-content:center;gap:8px}
.pc{flex:0 1 190px;min-width:0;display:grid;grid-template-columns:38px 1fr;grid-template-rows:auto auto;column-gap:6px;align-items:center;padding:6px 8px;border-radius:10px;background:rgba(10,16,50,.75);border:1px solid rgba(255,255,255,.12)}
.pc .o{grid-row:span 2;font-family:var(--display);font-weight:800;font-size:26px;color:var(--gold);text-align:center}
.pc .n{font-weight:700;font-size:14px;line-height:1.2;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.pc .ps{font-size:11px;color:var(--muted);font-weight:700}
.pc.in{border-color:var(--cyan);box-shadow:0 0 0 2px var(--cyan) inset}.pc.in .n,.pc.in .o{color:var(--cyan)}
.sqBox .squad{grid-template-columns:1fr;width:100%;max-height:52vh}
.sqBox .squad button{grid-template-columns:44px 1fr auto auto}
.squad .g{font-size:12px;font-weight:800;color:var(--muted);min-width:34px;text-align:right}.squad .g.up{color:var(--cyan)}
.squad button.sel{border-color:var(--cyan);box-shadow:0 0 0 2px var(--cyan) inset}
.pop.team{width:min(1000px,96vw)}.pop.team .pitch{min-height:0;width:100%}.pop.team .xiHead{width:100%;margin-bottom:-12px}
.teamHead{display:flex;align-items:center;gap:22px}.teamHead .crest{width:110px;height:110px}
.teamHead .name{font-family:var(--display);font-weight:800;font-size:clamp(32px,4vw,52px);text-transform:uppercase;line-height:1}
.tOvr{font-family:var(--display);font-weight:800;letter-spacing:.08em;color:var(--muted);font-size:20px;margin-top:6px}.tOvr b{color:var(--gold);font-size:28px}
.btnRow{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
@media (max-width:900px){.steal{grid-template-columns:1fr}.pitch{min-height:0}.sqBox .squad{max-height:36vh}}
@media (max-width:700px){.bar .sep{display:none}}
@media (prefers-reduced-motion:reduce){.pop{animation:none}.hex.flash{animation:none}}
</style>
</head>
<body>
<div class="app">

    <button class="league" id="lgLAL"><img src="img/la-liga.png" alt="" width="58" height="58">

    <button class="league" id="lgBL"><img src="img/bundesliga.png" alt="" width="58" height="58">

    <button class="league" id="lgL1"><img src="img/ligue-1.png" alt="" width="58" height="58">

    <button class="league" id="lgSA"><img src="img/serie-a.png" alt="" width="58" height="58">
      <span><b data-t="sa">Serie A</b><small id="saSub">20 teams</small></span></button>

  </div>

</div>

const LKEY="football-imperialism-lang";
let lang="en"; try{const v=localStorage.getItem(LKEY); if(STR[v]) lang=v;}catch(e){}
let langOpen=false;
const L=k=>STR[lang][k]??STR.en[k];
function applyLang(){
  document.documentElement.lang=lang; document.title=L("title");
  document.getElementById("map").setAttribute("aria-label",L("mapAria"));
  document.querySelectorAll("[data-t]").forEach(e=>e.textContent=L(e.dataset.t));
  [["uclSub",36],["uelSub",36],["eplSub",20],["tslSub",18],["lalSub",20],["blSub",18],["l1Sub",18],["saSub",20]].forEach(([id,n])=>{const e=document.getElementById(id); if(e) e.textContent=L("teamsN").replace("{n}",n)});
  if(typeof renderSound==="function") renderSound();
  if(typeof renderFull==="function") renderFull();
  const code=LANGS.find(l=>l[0]===lang)[1];
  const box=document.getElementById("lang");
  box.innerHTML=`<button class="small" id="langBtn" aria-haspopup="true" aria-expanded="${langOpen}" aria-label="${L("language")}">${FLAGS[lang]}${code}</button>`+
    (langOpen?`<div class="langmenu" role="menu">${LANGS.map(([k,c])=>`<button role="menuitem" class="${k===lang?"on":""}" data-lang="${k}">${FLAGS[k]}${c}</button>`).join("")}</div>`:"");
  document.getElementById("langBtn").onclick=e=>{e.stopPropagation();langOpen=!langOpen;applyLang()};
  box.querySelectorAll("[data-lang]").forEach(b=>b.onclick=e=>{e.stopPropagation();lang=b.dataset.lang;langOpen=false;try{localStorage.setItem(LKEY,lang)}catch(_){}applyLang();renderSide()});
}
document.addEventListener("click",()=>{if(langOpen){langOpen=false;applyLang()}});

const SLOTS=[["GK",["GK"]],["LB",["LB","LWB"]],["CB",["CB"]],["CB",["CB"]],["RB",["RB","RWB"]],["CDM",["CDM","CM"]],["CM",["CM","CDM","CAM"]],["CAM",["CAM","CM"]],["LW",["LW","LM"]],["ST",["ST","CF"]],["RW",["RW","RM"]]];
function hungarian(C){ // min-cost assignment of n rows to m>=n columns; returns the column for each row
  const n=C.length, m=C[0].length, u=new Array(n+1).fill(0), v=new Array(m+1).fill(0), p=new Array(m+1).fill(0), way=new Array(m+1).fill(0);
  for(let i=1;i<=n;i++){ p[0]=i; let j0=0; const minv=new Array(m+1).fill(Infinity), usedC=new Array(m+1).fill(false);
    do{ usedC[j0]=true; const i0=p[j0]; let d=Infinity, j1=0;
      for(let j=1;j<=m;j++) if(!usedC[j]){ const cur=C[i0-1][j-1]-u[i0]-v[j]; if(cur<minv[j]){minv[j]=cur;way[j]=j0} if(minv[j]<d){d=minv[j];j1=j} }

}
function bestXI(id,add){ // 4-3-3 with the best total rating; players go out of position only when no one fits a slot
  const sq=add?squad(id).concat([add]).sort((a,b)=>b[3]-a[3]):squad(id);
  if(!sq.length) return [];
  const line=pos=>pos==="GK"?0:/B$/.test(pos)?1:/^(CDM|CM|CAM|LM|RM)$/.test(pos)?2:3;
  const fit=(p,i)=>{ const [slot,ok]=SLOTS[i];
    if(ok.includes(p[1])) return {pen:0,cost:-p[3]*10};
    if((p[2]||"").split(/\s+/).some(q=>ok.includes(q))) return {pen:0,cost:-p[3]*10+3}; // main position wins a tie
    if(slot==="GK") return {pen:40,cost:1e5-p[3]*10};

    return {pen:8,cost:1e4-(p[3]-8)*10+50*Math.abs(line(p[1])-line(slot))}; // out of position costs 8; nearest line preferred
  };

  const by=k=>xi.filter(x=>k.includes(x.slot));

  return { xi, ovr:Math.round(xi.reduce((a,x)=>a+x.p[3]-x.pen,0)/11), raw:xi.reduce((a,x)=>a+x.p[3]-x.pen,0)/11,

    mid:avg(md,p=>.5*p[6]+.3*p[7]+.2*p[8]),

function pickScorer(st){

  const list=st.xi.map(x=>[x.p,(w[x.slot]||1)*Math.pow(x.p[5]/70,2)]), tot=list.reduce((a,x)=>a+x[1],0);
  let r=Math.random()*tot; for(const [p,v] of list){ if((r-=v)<=0) return p } return list[0][0];
}
function shootout(A,B){ // five each, then sudden death; better takers and keepers tilt it
  const takers=st=>st.xi.filter(x=>x.slot!=="GK").map(x=>x.p).sort((a,b)=>b[10]-a[10]);
  const ta=takers(A),tb=takers(B), pr=(p,g)=>Math.max(.5,Math.min(.93,.76+(p[10]-65)/220-(g-75)/260));
  let a=0,b=0,seq=[];
  for(let r=0;r<30;r++){ const x=Math.random()<pr(ta[r%10],B.gk), y=Math.random()<pr(tb[r%10],A.gk);

  const ev=[]; const mins=n=>Array.from({length:n},()=>1+Math.floor(Math.random()*90));
  mins(gh).forEach(m=>ev.push({m,side:0,p:pickScorer(H)})); mins(ga).forEach(m=>ev.push({m,side:1,p:pickScorer(A)}));
  ev.sort((x,y)=>x.m-y.m);

    <div id="mCtl" style="display:flex;flex-direction:column;align-items:center;gap:14px">
      ${sd&&sa?`<button class="primary" id="mSim">▶ ${L("simulate")}</button><div class="hint">${L("orPick")}</div>`:`<div class="hint">${DB?L("hint"):L("noData")}</div>`}
      <div class="row"><button id="wD">${L("won").replace("{t}",tn(d))}</button><button id="wA">${L("won").replace("{t}",tn(a))}</button></div>
      <button id="pCancel">${L("cancel")}</button></div></div></div>`;
  document.getElementById("wD").onclick=()=>stealPick(d.id);
  document.getElementById("wA").onclick=()=>stealPick(a.id);
  document.getElementById("pCancel").onclick=()=>{closePop();cancelTurn()};
  const sim=document.getElementById("mSim"); if(sim) sim.onclick=()=>playSim(d,a);
}
async function playSim(d,a){
  const r=simulate(d.id,a.id); busy=true; renderSide();
  document.getElementById("mCtl").innerHTML=""; const sc=document.getElementById("mScore"), cl=document.getElementById("mClock"), evb=document.getElementById("mEv");
  sc.className="score"; sc.textContent="0 – 0"; evb.hidden=false; cl.hidden=false;
  const wait=ms=>new Promise(res=>setTimeout(res,reduced?0:ms));
  let h=0,g=0,i=0;
  for(let m=0;m<=90;m++){
    cl.textContent=m+"'";
    while(i<r.ev.length&&r.ev[i].m===m){ const e=r.ev[i++]; e.side?g++:h++; sc.textContent=`${h} – ${g}`; tick(1.3);
      const row=`<div class="ev ${e.side?"":"evL"}">${e.side?"":`${esc(e.p[0])} <b>${e.m}'</b>`}${e.side?`<b>${e.m}'</b> ${esc(e.p[0])}`:""}</div>`;
      evb.insertAdjacentHTML("beforeend",e.side?`<div></div>${row}`:`${row}<div></div>`); await wait(500); }
    await wait(55);
  }
  cl.textContent=L("ft");
  if(r.so){ const pe=document.getElementById("mPens"); pe.hidden=false; let x="",y="";
    const draw=()=>{pe.innerHTML=`<b>${L("pens")}</b><div class="pl">${tn(d)} <i class="dots">${x}</i></div><div class="pl">${tn(a)} <i class="dots">${y}</i></div>`};
    draw(); for(const [u,v] of r.so.seq){ await wait(350); x+=u?"<b class=ok>●</b>":"<b class=miss>●</b>"; draw(); await wait(350); y+=v?"<b class=ok>●</b>":"<b class=miss>●</b>"; draw(); }
    const w=T[r.win]; pe.insertAdjacentHTML("beforeend",`<div>${L("penWin").replace("{t}",tn(w)).replace("{a}",Math.max(r.so.a,r.so.b)).replace("{b}",Math.min(r.so.a,r.so.b))}</div>`); }
  fanfare(); busy=false; renderSide();
  document.getElementById("mCtl").innerHTML=`<button class="primary" id="mGo">${L("cont")}</button>`;
  document.getElementById("mGo").onclick=()=>stealPick(r.win);
}
function stealPick(win){ // the winner may take one player from the loser's squad, previewing him in their best XI
  const lose=win===S.att?S.def:S.att, sq=squad(lose);
  if(!sq.length||alive().length<=2){ result(win,null); return } // no steal in the final: the game ends with it
  const w=T[win],l=T[lose], base=strength(win);
  const extra=new Set(S.log.filter(e=>e.steal&&e.steal.to===lose).map(e=>e.steal.p[0]));
  const gain=sq.map(p=>{ const s=strength(win,p); return {in:s&&s.xi.some(x=>x.p===p), d:s&&base?Math.round((s.raw-base.raw)*10)/10:0} });
  let sel=-1;
  pop.innerHTML=`<div class="overlay"><div class="pop wide"><h3>${L("stealT").replace("{t}",tn(w))}</h3>
    <div class="hint">${L("stealH").replace("{l}",tn(l)).replace("{t}",tn(w))}</div>
    <div class="steal"><div class="xiBox"><div class="xiHead"><span>${L("bestXI")}</span><b id="xOvr"></b></div><div class="pitch" id="xPitch"></div></div>
    <div class="sqBox"><div class="xiHead"><span>${tn(l)}</span></div><div class="squad">${sq.map((p,i)=>`<button data-i="${i}"><span class="o">${p[3]}</span><span class="n${extra.has(p[0])?" new":""}">${esc(p[0])}</span><span class="ps">${p[1]}</span><span class="g${gain[i].in?" up":""}">${gain[i].d>0?"+"+gain[i].d.toFixed(1):gain[i].in?L("starts"):""}</span></button>`).join("")}</div></div></div>
    <div class="btnRow"><button class="primary" id="sGo" disabled>${L("stealGo")}</button><button id="sSkip">${L("skip")}</button></div></div></div>`;
  const draw=()=>{
    const p=sel<0?null:sq[sel], st=p?strength(win,p):base;
    const o=document.getElementById("xOvr");
    o.innerHTML=!base||!st?"":p&&st.ovr!==base.ovr?`${L("ovr")} ${base.ovr} → <em>${st.ovr}</em>`:`${L("ovr")} ${base.ovr}`;
    document.getElementById("xPitch").innerHTML=pitchHTML(bestXI(win,p),p);
    const go=document.getElementById("sGo"); go.disabled=!p;
    go.textContent=p?L("stealP").replace("{p}",p[0]):L("stealGo");
    pop.querySelectorAll(".squad button").forEach(b=>b.classList.toggle("sel",+b.dataset.i===sel));
  };
  pop.querySelectorAll(".squad button").forEach(b=>b.onclick=()=>{ sel=+b.dataset.i===sel?-1:+b.dataset.i; draw() });
  document.getElementById("sGo").onclick=()=>{ if(sel>=0) result(win,{from:lose,to:win,p:sq[sel]}) };
  document.getElementById("sSkip").onclick=()=>result(win,null);
  draw();
}
function confetti(colors){ // falling paper confetti over everything; returns a stop function
  const cv=document.createElement("canvas"); cv.style.cssText="position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:50";
  document.body.appendChild(cv); const g=cv.getContext("2d"), dpr=window.devicePixelRatio||1;
  const size=()=>{cv.width=innerWidth*dpr;cv.height=innerHeight*dpr}; size(); addEventListener("resize",size);
  const N=reduced?60:260, P=[], t0=performance.now(); let on=true;
  const spawn=(y)=>({x:Math.random()*innerWidth,y,w:6+Math.random()*7,h:10+Math.random()*9,vx:(Math.random()-.5)*2.4,vy:2+Math.random()*3.5,r:Math.random()*6.3,vr:(Math.random()-.5)*.25,f:Math.random()*6.3,c:colors[Math.random()*colors.length|0]});
  for(let i=0;i<N;i++) P.push(spawn(-Math.random()*innerHeight*.6));
  (function frame(now){ if(!on) return; const age=now-t0; g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,innerWidth,innerHeight);
    for(let i=0;i<P.length;i++){ const p=P[i]; p.x+=p.vx+Math.sin(p.f)*.8; p.y+=p.vy; p.r+=p.vr; p.f+=.05;
      if(p.y>innerHeight+20){ if(age<6000) P[i]=spawn(-20); else continue }
      g.save(); g.translate(p.x,p.y); g.rotate(p.r); g.scale(1,Math.cos(p.f*2)); g.fillStyle=p.c; g.fillRect(-p.w/2,-p.h/2,p.w,p.h); g.restore(); }
    if(age<14000&&P.some(p=>p.y<=innerHeight+20)) requestAnimationFrame(frame); else stop();
  })(t0);
  function stop(){ if(!on) return; on=false; removeEventListener("resize",size); cv.remove() }
  return stop;
}
async function result(win,steal){
  closePop(); busy=true; renderSide();
  const lose=win===S.att?S.def:S.att, lost=hexesOf(lose);
  lost.forEach(i=>svg.querySelector(`[data-hex="${i}"]`).classList.add("flash"));
  await new Promise(r=>setTimeout(r,reduced?100:1800));
  const prev=S.owner.slice();
  S.owner=S.owner.map(o=>o===lose?win:o);
  S.log.push({att:S.att,def:S.def,win,lose,taken:lost.length,prev,steal:steal||null});
  S.att=S.def=S.defHex=null;S.phase=alive().length<=1?"over":"wheel";save();
  renderAll(); await new Promise(r=>setTimeout(r,reduced?100:1000)); // hold on the new border for a second
  await zoomTo(FULL); busy=false; renderAll();
  if(S.phase==="over"){const c=alive()[0];pop.innerHTML=`<div class="overlay"><div class="pop"><h3>${L(LEAGUE==="epl"?"championEng":LEAGUE==="tsl"?"championTur":LEAGUE==="lal"?"championEsp":LEAGUE==="bl"?"championGer":LEAGUE==="l1"?"championFra":LEAGUE==="sa"?"championIta":"champion")}</h3><div class="winner">${crestSVG(c)}<div class="name">${tn(c)}</div></div><button class="primary" id="pOk">${L("congrats")}</button></div></div>`;const stop=confetti([c.c1,"#F5C542","#35D6FF","#FFFFFF","#FF4B5C","#2ECC71"]);document.getElementById("pOk").onclick=()=>{stop();closePop()}}
}

/* ---------- side panel ---------- */
function renderSide(){
  const ph=S.phase;
  const set=(id,ready)=>{const b=document.getElementById(id);b.disabled=busy||!ready;b.classList.toggle("ready",!busy&&ready)};
  set("bWheel",ph==="wheel");set("bArrow",ph==="arrow");
  document.getElementById("bCancel").disabled=busy||!(ph==="arrow"||ph==="match");
  document.getElementById("bUndo").disabled=busy||!S.log.length;
  document.getElementById("bNew").disabled=busy;
  document.getElementById("bShuffle").disabled=busy||S.log.length>0||ph!=="wheel"; // only before the first land is taken
  const cf=document.getElementById("confirm");
  if(confirmNew){
    cf.innerHTML=`<span class="confirm">${L("confirmQ")} <button class="small danger" id="cYes">${L("confirmYes")}</button><button class="small" id="cNo">${L("confirmNo")}</button></span>`;
    document.getElementById("cYes").onclick=()=>{confirmNew=false;S=fresh();save();view=FULL.slice();renderAll()};
    document.getElementById("cNo").onclick=()=>{confirmNew=false;renderSide()};
  } else cf.innerHTML="";
}
function renderAll(){renderMap();renderSide()}
document.getElementById("bWheel").onclick=openWheel;
/* main menu: pick a league; the Champions League is the only one so far and resumes its saved game */
function showMenu(on){const lg=document.getElementById("lang"); document.getElementById("menu").hidden=!on;
  if(on) document.getElementById("menuLang").appendChild(lg); else document.getElementById("confirm").before(lg); // the language picker goes along
  langOpen=false; applyLang()}
document.getElementById("bMenu").onclick=()=>{if(!busy) showMenu(true)};
function setLeague(id){
  if(id!==LEAGUE){ LEAGUE=id; TEAMS=LEAGUES[id].teams; {const rows=LEAGUES[id].rows||ROWS; buildGrid(TEAMS.length/rows,rows);} T=Object.fromEntries(TEAMS.map(t=>[t.id,t])); KEY=LEAGUES[id].key;
    loadState(); SHAPE=null; LOGO_CACHE.key=null; confirmNew=false; arrowRot=S.angle||0; closePop();
    view=(S.att&&(S.phase==="arrow"||S.phase==="match")&&!isFinal())?focusBox(S.att):FULL.slice(); renderAll(); loadLogos();
    if(S.phase==="match") openMatch(); }
  showMenu(false);
}

document.getElementById("lgUEL").onclick=()=>setLeague("uel");

async function cancelTurn(){S.att=S.def=S.defHex=null;S.phase="wheel";save();renderAll();busy=true;await zoomTo(FULL);busy=false;renderSide()}
document.getElementById("bCancel").onclick=cancelTurn;
document.getElementById("bUndo").onclick=async()=>{const e=S.log.pop();if(!e)return;S.owner=e.prev;S.att=S.def=S.defHex=null;S.phase="wheel";save();renderAll();busy=true;await zoomTo(FULL);busy=false;renderSide()};
document.getElementById("bShuffle").onclick=()=>{if(S.log.length||S.phase!=="wheel"||busy)return;confirmNew=false;S=fresh();save();view=FULL.slice();renderAll()};

if(S.att&&(S.phase==="arrow"||S.phase==="match")&&!isFinal()) view=focusBox(S.att);
/* ---------- sound (made in the browser, no audio files) ---------- */
const SKEY="football-imperialism-sound";
let soundOn=true; try{soundOn=localStorage.getItem(SKEY)!=="off"}catch(e){}
let actx=null;
function audio(){ if(!soundOn) return null; try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==="suspended") actx.resume(); }catch(e){ return null } return actx }
let lastTick=0;
function tick(pitch=.7){ // soft wooden click, like a peg hitting the pointer
  const a=audio(); if(!a) return; const now=a.currentTime;
  if(now-lastTick<.05) return; lastTick=now; // never faster than 20 clicks a second, so a fast spin doesn't turn into a buzz
  const o=a.createOscillator(), g=a.createGain(), f=a.createBiquadFilter();
  o.type="triangle"; o.frequency.setValueAtTime(1400*pitch,now); o.frequency.exponentialRampToValueAtTime(420*pitch,now+.04);
  f.type="highpass"; f.frequency.value=300;
  g.gain.setValueAtTime(.0001,now); g.gain.exponentialRampToValueAtTime(.12,now+.003); g.gain.exponentialRampToValueAtTime(.0001,now+.06);
  o.connect(f).connect(g).connect(a.destination); o.start(now); o.stop(now+.07);
}
function spinTicker(){ // clicks spaced by spin speed: quick at the start, further apart as it slows
  let next=0;
  return t=>{ const now=performance.now(), speed=Math.pow(1-t,2); // ease-out cubic: speed falls with (1-t)^2
    if(now<next) return; const gap=50/Math.max(speed,1e-6); if(gap>1300) return;
    tick(.7); next=now+gap; };
}
function fanfare(){ // bright rising chord for the reveal
  const a=audio(); if(!a) return; const now=a.currentTime;
  [523.25,659.25,783.99,1046.5].forEach((fr,i)=>{
    const o=a.createOscillator(), g=a.createGain(); o.type="sawtooth"; o.frequency.value=fr;
    const lp=a.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=2600;
    const t0=now+i*.09; g.gain.setValueAtTime(.0001,t0); g.gain.exponentialRampToValueAtTime(.12,t0+.02); g.gain.exponentialRampToValueAtTime(.0001,t0+.9);
    o.connect(lp).connect(g).connect(a.destination); o.start(t0); o.stop(t0+1);
  });
}
function renderSound(){const b=document.getElementById("bSound");b.textContent=(soundOn?"🔊 ":"🔇 ")+L(soundOn?"soundOn":"soundOff");b.setAttribute("aria-pressed",soundOn)}
const fsEl=()=>document.fullscreenElement||document.webkitFullscreenElement;
function renderFull(){const b=document.getElementById("bFull");const on=!!fsEl();b.textContent=(on?"🗗 ":"⛶ ")+L(on?"fsOff":"fsOn");b.setAttribute("aria-pressed",on)}
{const b=document.getElementById("bFull"),de=document.documentElement;
 if(!(de.requestFullscreen||de.webkitRequestFullscreen)) b.hidden=true; // e.g. iPhone Safari has no page full screen
 b.onclick=()=>{ if(fsEl()) (document.exitFullscreen||document.webkitExitFullscreen).call(document);
   else (de.requestFullscreen||de.webkitRequestFullscreen).call(de) };
 document.addEventListener("fullscreenchange",renderFull); document.addEventListener("webkitfullscreenchange",renderFull); renderFull();}
document.getElementById("bSound").onclick=()=>{soundOn=!soundOn;try{localStorage.setItem(SKEY,soundOn?"on":"off")}catch(e){}renderSound();if(soundOn)tick()};
applyLang(); renderAll(); loadLogos(); showMenu(true);
if(S.phase==="match") openMatch(); // reopen an unfinished match after a reload
document.fonts&&document.fonts.ready.then(renderAll);
</script>
